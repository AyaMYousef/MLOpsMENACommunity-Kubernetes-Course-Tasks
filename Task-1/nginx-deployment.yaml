
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      shareProcessNamespace: true

      initContainers:
        - name: init-done
          image: busybox:1.36
          command: ["/bin/sh", "-c", "echo done"]

      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          command: ["/bin/sh", "-c"]
          args:
            - |
              printf 'hello in MLOPS MENA COMMUNITY : %s\n' "$(date '+%Y-%m-%d %H:%M:%S')" > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'

        - name: time-updater
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                for proc in /proc/[0-9]*; do
                  [ -r "$proc/comm" ] || continue
                  read -r name < "$proc/comm"
                  if [ "$name" = "nginx" ]; then
                    pid="${proc##*/}"
                    printf 'hello in MLOPS MENA COMMUNITY : %s\n' "$(date '+%Y-%m-%d %H:%M:%S')" > "$proc/root/usr/share/nginx/html/index.html"
                    break
                  fi
                done
                sleep 5
              done
